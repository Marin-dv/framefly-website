<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/css/fonts.css"><link rel="stylesheet" href="../assets/css/site.css">
<style>
body{width:1200px;height:630px;overflow:hidden;margin:0}
body::after{opacity:.05}
.og{position:relative;z-index:1;display:grid;grid-template-columns:1fr 470px;gap:48px;align-items:center;height:630px;padding:0 72px}
.og h1{font-size:74px;letter-spacing:-.05em;line-height:.95;font-weight:640}
.og h1 span{color:var(--fg-3)}
.og .brand{font-size:26px;gap:14px;margin-bottom:44px}.og .brand svg{width:44px;height:44px}
.og p{margin-top:30px;font-size:24px;color:var(--fg-2);letter-spacing:-.01em}
.og .slate{max-width:470px;justify-self:end;--led:50px}
.og .led-labels span{width:calc(var(--led) * 1.1)}
</style></head><body>
<div class="og">
  <div>
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#d3f261"/><g fill="none" stroke="#12150a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 12V9.5a2 2 0 0 1 2-2H12M20 7.5h2.5a2 2 0 0 1 2 2V12M24.5 20v2.5a2 2 0 0 1-2 2H20M12 24.5H9.5a2 2 0 0 1-2-2V20"/></g><g fill="#12150a"><circle cx="11.6" cy="20.3" r=".95"/><circle cx="13.9" cy="17.4" r="1.3"/><circle cx="16.8" cy="15.4" r="1.75"/><circle cx="20.4" cy="14.4" r="2.7"/></g></svg><span>Framefly</span></div>
    <h1>Prompt in.<br><span>Demo video out.</span></h1>
    <p>Launching October 28, 2026 &middot; framefly.app</p>
  </div>
  <figure class="slate" data-live="false">
    <div class="slate-sticks"><span class="stick stick-base"></span><span class="stick stick-top"></span><span class="stick-hinge"></span></div>
    <div class="slate-body">
      <div class="slate-fields"><div class="slate-field"><span>Production</span><b>Framefly</b></div><div class="slate-field"><span>Scene</span><b>Launch</b></div><div class="slate-field"><span>Take</span><b>1</b></div></div>
      <div class="led-well"><div class="led" id="led"></div><div class="led-labels"><span>Day</span><i></i><span>Month</span><i></i><span>Year</span></div></div>
      <div class="slate-fields"><div class="slate-field"><span>Director</span><b>Framefly agent</b></div><div class="slate-field"><span>Final cut</span><b class="you">You</b></div><div class="slate-field"><span>Date</span><b>28 OCT 26</b></div></div>
    </div>
  </figure>
</div>
<script>
var SEG={0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcdfg"};
var led=document.getElementById("led");
["28","10","26"].forEach(function(g,gi){ if(gi){var c=document.createElement("span");c.className="led-colon";led.appendChild(c);} var grp=document.createElement("span");grp.className="led-group";
 g.split("").forEach(function(ch){var d=document.createElement("span");d.className="digit";"abcdefg".split("").forEach(function(k){var i=document.createElement("i");i.className=k+(SEG[ch].indexOf(k)>-1?" on":"");d.appendChild(i);});grp.appendChild(d);}); led.appendChild(grp);});
</script></body></html>

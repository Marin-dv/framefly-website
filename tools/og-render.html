<!doctype html>
<!-- The social card (assets/img/og.png). Open it at 1200x630 in any headless browser and take a screenshot. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<base href="../">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 500px 1fr; align-items: center; gap: 44px; padding: 0 0 0 64px; background: #f3f3f4; position: relative; }
  .glow { position: absolute; inset: -200px 0 auto -100px; height: 560px; width: 900px; background: radial-gradient(50% 60% at 30% 30%, rgba(211, 242, 97, 0.75), transparent 70%); filter: blur(30px); }
  .copy { position: relative; display: grid; gap: 26px; }
  .brand { font-size: 30px; gap: 14px; }
  .brand .mark-svg { width: 48px; height: 48px; }
  h1 { font-size: 74px; line-height: 0.98; white-space: nowrap; }
  p { font: 400 25px/1.4 var(--f-sans); color: #50505a; max-width: 17em; }
  .film { position: relative; height: 430px; aspect-ratio: 16 / 9; border-radius: 24px 0 0 24px; overflow: hidden; box-shadow: 0 0 0 1px rgba(12, 12, 20, 0.12), 0 40px 80px -30px rgba(20, 20, 40, 0.45); }
  .film img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <span class="brand"><svg class="mark-svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#d3f261"/><g fill="none" stroke="#12150a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 12V9.5a2 2 0 0 1 2-2H12M20 7.5h2.5a2 2 0 0 1 2 2V12M24.5 20v2.5a2 2 0 0 1-2 2H20M12 24.5H9.5a2 2 0 0 1-2-2V20"/></g><g fill="#12150a"><circle cx="11.6" cy="20.3" r=".95"/><circle cx="13.9" cy="17.4" r="1.3"/><circle cx="16.8" cy="15.4" r="1.75"/><circle cx="20.4" cy="14.4" r="2.7"/></g></svg>Framefly</span>
    <h1>Prompt in.<br><span class="mark">Demo video</span> out.</h1>
    <p>It explores your app, writes the video and films it.</p>
  </div>
  <div class="film"><img src="assets/films/launch-continuous.webp" alt=""></div>
</body>
</html>

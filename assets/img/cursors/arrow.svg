<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
  <!-- Framefly's pointer: a tail-less arrow with rounded corners, near-black with a white edge, so it
       reads on a light page and on a dark one. Hotspot at the tip (5, 4). -->
  <defs>
    <filter id="s" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="1.3" stdDeviation="1.2" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <path d="M5.6 4.4 L5.6 20 L10.4 15.6 L17.2 15.6 Z" fill="#131417" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" filter="url(#s)"/>
</svg>
